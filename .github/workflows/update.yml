# Keeps the app alive after the hackathon: once a day it refreshes the satellite orbits and,
# when NASA has a new NISAR pass over one of the places, adds it to the app.
name: Update data

on:
  schedule:
    - cron: "17 5 * * *" # every day at 05:17 UTC
  workflow_dispatch: # can also be started by hand from the Actions tab

permissions:
  contents: write

concurrency: update-data

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Satellite orbits (no login needed)
        run: python pipeline/fetch_tle.py || echo "Orbit update failed, keeping the old file."

      - name: New NISAR passes (needs the EARTHDATA_TOKEN secret)
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: |
          if [ -z "$EARTHDATA_TOKEN" ]; then
            echo "No EARTHDATA_TOKEN secret is set, so the radar data is left as it is."
            exit 0
          fi
          python pipeline/update_sites.py

      - name: Commit and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A web/data
          if git diff --cached --quiet; then echo "Nothing new today."; exit 0; fi
          git commit -m "Automatic data update"
          git push origin main
          git subtree push --prefix web origin gh-pages
